<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- navbar -->
    <div class="navbar">
        <!-- image section -->
        <div class="logo">
            <img src="./nav/Storefront.png" alt="">
            <span>NFT Marketplace</span>
        </div>
        <!-- menu content -->
        <div class="menu-content">
            <ul>
                <li class="menu-list">marketplace</li>
                <li class="menu-list">ranking</li>
                <li class="menu-list">connect wallet</li>
                <li class="menu-list">
                    <button class="menu-btn">
                        <img src="./nav/User.svg" alt="">
                        <span>Sign up</span>
                    </button>
                </li>
            </ul>
            <img class="hamburger" src="./nav/Storefront.png" alt="">
        </div>
    </div>
    <!-- Hero section -->
    <div class="hero-section">
        <!-- hero-content -->
        <div class="hero-content">
            <h1>Discover digital art & Collect NFTs</h1>
            <p>NFT marketplace UI created with Anima for Figma. Collect, buy and sell art from more than 20k NFT
                artists.</p>
            <button>
                <img src="./nav/RocketLaunch.svg" alt="">
                <span>get started</span>
            </button>
            <div class="happy-client">
                <div class="stats">
                    <h3>240k+</h3>
                    <div>Total Sale</div>
                </div>
                <div class="stats">
                    <h3>240k+</h3>
                    <div>Autions</div>
                </div>
                <div class="stats">
                    <h3>240k+</h3>
                    <div>Artists</div>
                </div>
            </div>
        </div>
        <!-- hero-image -->
        <div class="hero-image">
            <img src="./Image Placeholder.png" alt="">
            <div class="comment">
                <p>Space Walking</p>
                <div class="user-profile">
                    <img src="./nav/Asset 12 2.png" alt="">
                    <span>Animakid</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
