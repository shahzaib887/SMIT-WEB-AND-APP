<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car fuel</title>
</head>
<body>
    

<script>
    var user = +prompt("Car fuel Check");
    var fuel = 0.25;

    if(user < fuel){
        alert("Please refill the fuel in your car" + user)
    }else{
        alert("Car fuel " + user + " liters")
    }
</script>

</body>
</html>
